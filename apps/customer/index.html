<!-- Font CSS loads without blocking the first paint (display=swap shows the system font until it arrives). -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

<script>
/* الافتتاحية السينمائية: مرة واحدة لكل جلسة. الفحص مبكر لمنع أي وميض عند الدخول الداخلي المتكرر. */
/* LCP: the home hero photo is rendered by JS after ~45 scripts; preloading it on the home route lets it download in parallel. */
(function(){try{if(!location.hash||/^#\/?(home)?$/.test(location.hash)){var h=document.createElement('link');h.rel='preload';h.as='image';h.href='../../assets/brand/'+'hero-tech-v3.jpg';   /* first visit: the onboarding photo covers the hero */h.setAttribute('fetchpriority','high');document.head.appendChild(h);}}catch(e){}})();
(function(){try{var d=document.documentElement;if(sessionStorage.getItem('hs_intro_v1')){d.classList.add('no-intro');}else{sessionStorage.setItem('hs_intro_v1','1');['brand/hsl-mark.svg','brand/hsl-word.png'].forEach(function(n){var l=document.createElement('link');l.rel='preload';l.as='image';l.href='../../assets/'+n;document.head.appendChild(l);});}}catch(e){}})();
</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f1f7"/><stop offset=".5" stop-color="#bdb7c6"/><stop offset="1" stop-color="#7b7487"/></linearGradient>
  <linearGradient id="metal2" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#8d8698"/><stop offset=".5" stop-color="#e6e2ea"/><stop offset="1" stop-color="#a39cae"/></linearGradient>
  <radialGradient id="glass" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#4b5e86"/><stop offset=".45" stop-color="#1a2238"/><stop offset="1" stop-color="#04120D"/></radialGradient>
  <linearGradient id="pinkg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5FC79C"/><stop offset="1" stop-color="#2FA57A"/></linearGradient>
  <filter id="gb6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="gb10" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
</defs></svg>

<div id="app">
  <div class="bg-blob b1"></div><div class="bg-blob b2"></div>
  <main id="view"><!-- Boot loader: painted at once while the scripts download; the first render replaces it. -->
    <div role="status" style="display:grid;justify-items:center;align-content:center;gap:14px;min-height:62vh;color:var(--text-secondary,#6b625a);font-size:14px"><span class="spinner" aria-hidden="true"></span>جاري التحميل…</div></main>
  <nav id="tabbar"></nav>
  <div id="sheet-backdrop"></div>
  <section id="sheet" role="dialog" aria-modal="true" tabindex="-1"></section>
  <div id="toast" role="status"></div>
</div>

<!-- V10 intro: calm logo reveal (owner artwork). Outside #app on purpose so position:fixed covers the viewport.
     Controller: Intro in app.js (once per session, skip, reduced motion). -->
<div id="intro" role="group" aria-label="هنصلحلك — خدماتك، في تجربة أسهل.">
  <div class="in-stage">
    <div class="in-markwrap"><div class="in-halo" aria-hidden="true"></div><img class="in-mark main" src="../../assets/brand/hsl-mark.svg" alt="" width="384" height="384" decoding="async" draggable="false"></div>
    <img class="in-word main" src="../../assets/brand/hsl-word.png" alt="هنصلحلك HANSALEHLAK" width="288" height="136" decoding="async" draggable="false">
    <p class="in-tag">خدماتك، في تجربة أسهل.</p>
  </div>
  <button type="button" class="in-skip" id="introSkip">تخطي</button>
</div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>

<!-- ═════════ تحميل السكربتات — الترتيب حرج (سكربتات كلاسيكية تعتمد على ما قبلها) ═════════
     الأيقونات والتبويبات ← البيانات القديمة ← الكتالوج (CAT) ← مخزن السوق المشترك (MP — نفس بيانات تطبيق مقدم الخدمة والإدارة)
     ← جلسة العميل والموجّه وسياسة/مدخل الزائر ← الرئيسية ← app.js ← ui-kit ← الطلبات/التتبع/مقدمو الخدمة ← market-ui ← المعالج
     ← مدخل إنشاء الطلب ← المرفقات ← البحث/الاكتشاف/العناوين/الحساب/الدعم.
     لا تُحمَّل هنا أي واجهة لمقدم الخدمة أو الإدارة: مقدم الخدمة في apps/provider/ (الانضمام عبر ../provider/index.html#/join)
     والإدارة تطبيق مستقل بمدخل مقيد خاص به، ولا يُربط من هنا. -->
